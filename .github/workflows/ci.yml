# The website's checks, on Linux (the owner's Windows PC cannot run Vite 8: Smart App Control blocks its native
# bundler). Runs on every push of a non-main branch and by hand. It builds, tests and audits; it deploys nothing.
#
# Every check's output is kept under `evidence/<commit>/` and committed to the `ci-evidence` branch (never forced),
# because a job's own logs need repository-admin rights to read, even on a public repository. Every check after the
# build runs even when an earlier one failed, so one run gives the whole picture; the job still fails.
name: ci

on:
  push:
    branches-ignore: [main, ci-evidence]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write # only to commit the evidence branch
    env:
      EV: evidence/${{ github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p "$EV"
      - name: Install
        run: set -o pipefail; npm ci --no-audit --no-fund 2>&1 | tee "$EV/install.log"
      - name: Typecheck
        run: set -o pipefail; npm run typecheck 2>&1 | tee "$EV/typecheck.log"
      - name: Unit and component tests
        run: set -o pipefail; npm test 2>&1 | tee "$EV/test.log"
      - name: A production build is refused while inputs or legal decisions are missing (docs/74 §3)
        run: |
          set +e
          npx vite build --mode production > "$EV/production-refusal.log" 2>&1
          code=$?
          set -e
          cat "$EV/production-refusal.log"
          if [ "$code" -eq 0 ]; then echo "FAIL: a production build succeeded without its inputs"; exit 1; fi
          grep -q "Nothing was published" "$EV/production-refusal.log"
          if [ -e dist/index.html ]; then echo "FAIL: the refused build left files"; exit 1; fi
      - name: Preview build (marked test values, noindex) and prerender
        env:
          # The browser checks answer the API from a mock on this origin; a preview's CSP allows it.
          VITE_API_BASE: http://127.0.0.1:3999/api/v1
        run: set -o pipefail; npm run build:preview 2>&1 | tee "$EV/build.log"
      - name: List the built site
        if: ${{ !cancelled() }}
        run: (cd dist && find . -type f | sort) | tee "$EV/dist-files.txt"
      - name: Broken-link audit
        if: ${{ !cancelled() }}
        run: set -o pipefail; node scripts/audit-links.mjs dist 2>&1 | tee "$EV/audit-links.txt"
      - name: Exported-bundle audit
        if: ${{ !cancelled() }}
        run: set -o pipefail; node scripts/audit-bundle.mjs dist --preview 2>&1 | tee "$EV/audit-bundle.txt"
      - name: Dependency audit (recorded, triaged in docs/74 §9)
        if: ${{ !cancelled() }}
        run: |
          npm audit --json > "$EV/npm-audit.json" || true
          npm audit > "$EV/npm-audit.txt" 2>&1 || true
          tail -5 "$EV/npm-audit.txt"
      - name: Full-history secret scan of this repository, and of the built site
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact --no-banner --report-format json --report-path "/repo/$EV/gitleaks-history.json" > "$EV/gitleaks-history.txt" 2>&1; echo "history exit $?" | tee -a "$EV/gitleaks-history.txt"
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest dir /repo/dist --redact --no-banner --report-format json --report-path "/repo/$EV/gitleaks-dist.json" > "$EV/gitleaks-dist.txt" 2>&1; echo "dist exit $?" | tee -a "$EV/gitleaks-dist.txt"
          grep -h "exit\|leaks found\|no leaks" "$EV"/gitleaks-*.txt
      - name: Browser (Playwright Chromium)
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium > "$EV/playwright-install.log" 2>&1
      - name: Brand images (social preview, icons) for review
        if: ${{ !cancelled() }}
        run: node scripts/brand-assets.mjs "$EV/brand-assets"
      - name: Browser checks — every public page, three languages, 375/320 px, desktop, 200% text, axe, keyboard, headers
        if: ${{ !cancelled() }}
        run: set -o pipefail; npx playwright test 2>&1 | tee "$EV/playwright.log"
      - name: Contact sheets and the screenshot index
        if: always()
        run: node scripts/contact-sheets.mjs "$EV" || true
      - name: Keep the built preview for review
        if: always()
        run: if [ -d dist ]; then cp -r dist "$EV/dist"; fi
      # The public pages alone, for https://tsxmr.com while the business account and the API live elsewhere (docs/95).
      - name: Public build (VITE_SITE_SURFACE=public) — refusal without the API, preview, links, bundle
        if: ${{ !cancelled() }}
        env:
          VITE_SITE_SURFACE: public
        run: |
          set +e
          npx vite build --mode production > "$EV/public-production-refusal.log" 2>&1
          code=$?
          set -e
          cat "$EV/public-production-refusal.log"
          if [ "$code" -eq 0 ]; then echo "FAIL: a public production build succeeded without its inputs"; exit 1; fi
          grep -q "Nothing was published" "$EV/public-production-refusal.log"
          if grep -q "VITE_API_BASE" "$EV/public-production-refusal.log"; then echo "FAIL: a public build asked for the API"; exit 1; fi
          rm -rf dist dist-ssr
          set -o pipefail
          npm run build:preview 2>&1 | tee "$EV/public-build.log"
          (cd dist && find . -type f | sort) > "$EV/public-dist-files.txt"
          node scripts/audit-links.mjs dist 2>&1 | tee "$EV/public-audit-links.txt"
          node scripts/audit-bundle.mjs dist --preview --public 2>&1 | tee "$EV/public-audit-bundle.txt"
          cp -r dist "$EV/dist-public"
      - name: Keep the evidence
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'commit %s\nbranch %s\nrun %s\nresult %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$RESULT" > "$EV/summary.txt"
          rm -rf "$EV/playwright-output"
          cp -r evidence /tmp/evidence
          git config user.name "ci-evidence"
          git config user.email "ci-evidence@users.noreply.github.com"
          git stash -u -q || true
          if git fetch -q origin ci-evidence; then git checkout -q -B ci-evidence origin/ci-evidence; else git checkout -q --orphan ci-evidence; git rm -rq --cached . ; git clean -fdq -e node_modules; fi
          rm -rf evidence/"$GITHUB_SHA"; mkdir -p evidence; cp -r /tmp/evidence/"$GITHUB_SHA" evidence/
          git add evidence/"$GITHUB_SHA"
          git commit -qm "evidence: $GITHUB_REF_NAME $GITHUB_SHA ($RESULT)"
          for i in 1 2 3 4 5; do git push -q origin ci-evidence && break; git fetch -q origin ci-evidence && git rebase -q origin/ci-evidence; done
