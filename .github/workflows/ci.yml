# The website's checks, on Linux (the owner's Windows PC cannot run Vite 8: Smart App Control blocks its native
# bundler). Runs on every push of a non-main branch and by hand. It builds, tests and audits; it deploys nothing.
#
# Every check's output is kept under `evidence/<commit>/` and committed to the `ci-evidence` branch (never forced),
# because a job's own logs need repository-admin rights to read, even on a public repository. Every check after the
# build runs even when an earlier one failed, so one run gives the whole picture; the job still fails.
name: ci

on:
  push:
    branches-ignore: [main, ci-evidence]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write # only to commit the evidence branch
    env:
      EV: evidence/${{ github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p "$EV"
      - name: Install
        run: set -o pipefail; npm ci --no-audit --no-fund 2>&1 | tee "$EV/install.log"
      - name: Typecheck
        run: set -o pipefail; npm run typecheck 2>&1 | tee "$EV/typecheck.log"
      - name: Unit and component tests
        run: set -o pipefail; npm test 2>&1 | tee "$EV/test.log"
      - name: A production build is refused while inputs or legal decisions are missing (docs/74 §3)
        run: |
          set +e
          npx vite build --mode production > "$EV/production-refusal.log" 2>&1
          code=$?
          set -e
          cat "$EV/production-refusal.log"
          if [ "$code" -eq 0 ]; then echo "FAIL: a production build succeeded without its inputs"; exit 1; fi
          grep -q "Nothing was published" "$EV/production-refusal.log"
          grep -q "(gate PORTAL)" "$EV/production-refusal.log"
          if [ -e dist/index.html ]; then echo "FAIL: the refused build left files"; exit 1; fi
      - name: Preview build (marked test values, noindex) and prerender
        env:
          # The browser checks answer the API from a mock on this origin; a preview's CSP allows it.
          VITE_API_BASE: http://127.0.0.1:3999/api/v1
        run: set -o pipefail; npm run build:preview 2>&1 | tee "$EV/build.log"
      - name: List the built site
        if: ${{ !cancelled() }}
        run: (cd dist && find . -type f | sort) | tee "$EV/dist-files.txt"
      - name: Broken-link audit
        if: ${{ !cancelled() }}
        run: set -o pipefail; node scripts/audit-links.mjs dist 2>&1 | tee "$EV/audit-links.txt"
      - name: Exported-bundle audit
        if: ${{ !cancelled() }}
        run: set -o pipefail; node scripts/audit-bundle.mjs dist --preview 2>&1 | tee "$EV/audit-bundle.txt"
      - name: Dependency audit (recorded, triaged in docs/74 §9)
        if: ${{ !cancelled() }}
        run: |
          npm audit --json > "$EV/npm-audit.json" || true
          npm audit > "$EV/npm-audit.txt" 2>&1 || true
          tail -5 "$EV/npm-audit.txt"
      - name: Full-history secret scan of this repository, and of the built site
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact --no-banner --report-format json --report-path "/repo/$EV/gitleaks-history.json" > "$EV/gitleaks-history.txt" 2>&1; echo "history exit $?" | tee -a "$EV/gitleaks-history.txt"
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest dir /repo/dist --redact --no-banner --report-format json --report-path "/repo/$EV/gitleaks-dist.json" > "$EV/gitleaks-dist.txt" 2>&1; echo "dist exit $?" | tee -a "$EV/gitleaks-dist.txt"
          grep -h "exit\|leaks found\|no leaks" "$EV"/gitleaks-*.txt
      - name: Browser (Playwright Chromium)
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium > "$EV/playwright-install.log" 2>&1
      - name: Brand images (social preview, icons) for review
        if: ${{ !cancelled() }}
        run: node scripts/brand-assets.mjs "$EV/brand-assets"
      - name: Browser checks — every public page, three languages, 375/320 px, desktop, 200% text, axe, keyboard, headers
        if: ${{ !cancelled() }}
        run: set -o pipefail; npx playwright test 2>&1 | tee "$EV/playwright.log"
      - name: Contact sheets and the screenshot index
        if: always()
        run: node scripts/contact-sheets.mjs "$EV" || true
      - name: Keep the built preview for review
        if: always()
        run: if [ -d dist ]; then cp -r dist "$EV/dist"; fi
      # The public pages alone, for https://tsxmr.com while the business account and the API live elsewhere (docs/95).
      - name: Public build (VITE_SITE_SURFACE=public) — refusal without the API, preview, links, bundle
        if: ${{ !cancelled() }}
        env:
          VITE_SITE_SURFACE: public
        run: |
          set +e
          npx vite build --mode production > "$EV/public-production-refusal.log" 2>&1
          code=$?
          set -e
          cat "$EV/public-production-refusal.log"
          if [ "$code" -eq 0 ]; then echo "FAIL: a public production build succeeded without its inputs"; exit 1; fi
          grep -q "Nothing was published" "$EV/public-production-refusal.log"
          grep -q "(gate PUBLIC_WEBSITE)" "$EV/public-production-refusal.log"
          # The pre-launch website needs neither the API nor the app's deletion channel (those are the PORTAL and APP_STORE gates).
          if grep -qE "VITE_API_BASE|VITE_ACCOUNT_DELETION_CHANNEL" "$EV/public-production-refusal.log"; then echo "FAIL: the public gate asked for a portal or app input"; exit 1; fi
          rm -rf dist dist-ssr
          set -o pipefail
          npm run build:preview 2>&1 | tee "$EV/public-build.log"
          (cd dist && find . -type f | sort) > "$EV/public-dist-files.txt"
          node scripts/audit-links.mjs dist 2>&1 | tee "$EV/public-audit-links.txt"
          node scripts/audit-bundle.mjs dist --preview --public 2>&1 | tee "$EV/public-audit-bundle.txt"
          cp -r dist "$EV/dist-public"
      - name: Public site in a browser (E2E_SURFACE=public) — EN/FR/AR at 375 px and desktop, axe, no foreign request
        if: ${{ !cancelled() }}
        env:
          E2E_SURFACE: public
        run: |
          mkdir -p "$EV/public"
          set -o pipefail
          EV="$EV/public" npx playwright test 2>&1 | tee "$EV/public/playwright.log"
      - name: Public site contact sheets
        if: always()
        run: if [ -d "$EV/public/screenshots" ]; then node scripts/contact-sheets.mjs "$EV/public" || true; fi
      - name: Release verdicts — PUBLIC_WEBSITE, PORTAL, APP_STORE (docs/96; recorded, not required here)
        if: always()
        run: |
          if [ -f dist-ssr/entry-server.js ]; then
            node scripts/release-verdicts.mjs --dist dist --links "$EV/public-audit-links.txt" --browser "$EV/public/playwright-results.json" 2>&1 | tee "$EV/release-verdicts.txt"
          fi
          rm -rf "$EV/public/playwright-output"
      # The Dukan ERP portal alone, for https://dukan.tsxmr.com (docs/101): the Owner's /subscription and the console, no
      # page of the company site, nothing indexed.
      - name: Portal build (VITE_SITE_SURFACE=portal) — refusal without its inputs, preview, links, bundle
        if: ${{ !cancelled() }}
        env:
          VITE_SITE_SURFACE: portal
        run: |
          set +e
          npx vite build --mode production > "$EV/portal-production-refusal.log" 2>&1
          code=$?
          set -e
          cat "$EV/portal-production-refusal.log"
          if [ "$code" -eq 0 ]; then echo "FAIL: a portal production build succeeded without its inputs"; exit 1; fi
          grep -q "Nothing was published" "$EV/portal-production-refusal.log"
          grep -q "(gate PORTAL)" "$EV/portal-production-refusal.log"
          grep -q "VITE_PORTAL_ORIGIN" "$EV/portal-production-refusal.log"
          rm -rf dist dist-ssr
          set -o pipefail
          # The browser checks answer the API from a mock on this origin; a preview's CSP allows it.
          VITE_API_BASE=http://127.0.0.1:3999/api/v1 npm run build:preview 2>&1 | tee "$EV/portal-build.log"
          (cd dist && find . -type f | sort) > "$EV/portal-dist-files.txt"
          node scripts/audit-links.mjs dist 2>&1 | tee "$EV/portal-audit-links.txt"
          node scripts/audit-bundle.mjs dist --preview --portal 2>&1 | tee "$EV/portal-audit-bundle.txt"
          cp -r dist "$EV/dist-portal"
      - name: Portal in a browser (E2E_SURFACE=portal) — EN/FR/AR at 375 px and desktop, axe, headers, the claim
        if: ${{ !cancelled() }}
        env:
          E2E_SURFACE: portal
        run: |
          mkdir -p "$EV/portal"
          set -o pipefail
          EV="$EV/portal" npx playwright test 2>&1 | tee "$EV/portal/playwright.log"
      - name: Portal contact sheets
        if: always()
        run: |
          if [ -d "$EV/portal/screenshots" ]; then node scripts/contact-sheets.mjs "$EV/portal" || true; fi
          rm -rf "$EV/portal/playwright-output"
      # The console alone, for https://admin.tsxmr.com. A real production build: its gate needs no customers' legal decision.
      - name: Admin build (VITE_SITE_SURFACE=admin) — refusals, production build, audits, release package
        if: ${{ !cancelled() }}
        env:
          VITE_SITE_SURFACE: admin
          VITE_ADMIN_SITE_ORIGIN: https://admin.tsxmr.com
          VITE_PUBLIC_SITE_ORIGIN: https://tsxmr.com
        run: |
          rm -rf dist dist-ssr
          for api in "" https://dukan-test.tsxmr.com/api/v1 http://127.0.0.1:3010/api/v1; do
            set +e
            VITE_API_BASE="$api" npx vite build --mode production >> "$EV/admin-production-refusal.log" 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then echo "FAIL: an admin build was made for API '$api'"; exit 1; fi
          done
          grep -q "(gate ADMIN)" "$EV/admin-production-refusal.log"
          rm -rf dist dist-ssr
          set -o pipefail
          VITE_API_BASE=https://api.tsxmr.com/api/v1 npm run build 2>&1 | tee "$EV/admin-build.log"
          (cd dist && find . -type f | sort) > "$EV/admin-dist-files.txt"
          node scripts/audit-bundle.mjs dist --admin 2>&1 | tee "$EV/admin-audit-bundle.txt"
          node scripts/caddy-admin-release.mjs dist /tmp/admin-release "$GITHUB_SHA" 2>&1 | tee "$EV/admin-release.txt"
          docker run --rm -v "$PWD/dist:/dist" zricethezav/gitleaks:latest dir /dist --redact --no-banner 2>&1 | tail -2 | tee "$EV/admin-gitleaks.txt"
          (cd /tmp/admin-release && tar czf - .) > "$EV/admin-release.tar.gz"
      - name: Admin site in a browser (E2E_SURFACE=admin) — EN/FR/AR, RTL, axe, headers, no customers' address
        if: ${{ !cancelled() }}
        env:
          VITE_SITE_SURFACE: admin
          E2E_SURFACE: admin
        run: |
          rm -rf dist dist-ssr
          mkdir -p "$EV/admin"
          set -o pipefail
          VITE_API_BASE=http://127.0.0.1:3999/api/v1 npm run build:preview 2>&1 | tee "$EV/admin-preview-build.log"
          node scripts/audit-bundle.mjs dist --preview --admin 2>&1 | tee "$EV/admin-preview-audit.txt"
          EV="$EV/admin" npx playwright test 2>&1 | tee "$EV/admin/playwright.log"
          rm -rf "$EV/admin/playwright-output"
      - name: The customers' portal holds no console (production aliases, --mode customer-audit)
        if: ${{ !cancelled() }}
        env:
          VITE_SITE_SURFACE: portal
        run: |
          rm -rf dist dist-ssr
          set -o pipefail
          VITE_API_BASE=https://api.tsxmr.com/api/v1 npx vite build --mode customer-audit 2>&1 | tee "$EV/customer-audit-build.log"
          npx vite build --ssr src/entry-server.tsx --outDir dist-ssr --mode customer-audit > /dev/null
          node scripts/prerender.mjs > /dev/null
          node scripts/audit-bundle.mjs dist --preview --portal --no-console 2>&1 | tee "$EV/customer-audit.txt"
          # Post-Build-4: the portal package, from this build — its checks proven while the PORTAL gate keeps production closed.
          node scripts/caddy-portal-release.mjs dist /tmp/portal-release "$GITHUB_SHA" --audit 2>&1 | tee "$EV/portal-release.txt"
          grep -q "audit build" /tmp/portal-release/portal-release.txt
          if grep -rqE "platform/admin/|platform/businesses" /tmp/portal-release/site; then echo "FAIL: console code in the portal package"; exit 1; fi
          if grep -qF "/admin" /tmp/portal-release/routes.caddy; then echo "FAIL: /admin in the portal routes"; exit 1; fi
          grep -qF "/claim/*" /tmp/portal-release/routes.caddy
      # The production portal package for https://dukan.tsxmr.com (owner, 2026-11-05): a real production build of the
      # portal alone — no console — for the backend release deployed at api.tsxmr.com, WhatsApp onboarding, email
      # disabled, email-assisted deletion at launch. Its public identity and service commitments are GitHub repository
      # variables (public values, never secrets); without every one of them the step says so and builds nothing. The
      # package and its checksums go to this commit's evidence; deploy/production/portal-site.sh installs it.
      - name: Portal release package (production, console-less) for https://dukan.tsxmr.com
        if: ${{ !cancelled() }}
        env:
          VITE_SITE_SURFACE: portal
          VITE_API_BASE: https://api.tsxmr.com/api/v1
          VITE_PORTAL_ORIGIN: https://dukan.tsxmr.com
          VITE_PORTAL_LAUNCH_CHANNEL: whatsapp
          VITE_PORTAL_EMAIL_CHANNEL: disabled
          VITE_PORTAL_BACKEND_RELEASE: ${{ vars.PORTAL_BACKEND_RELEASE }}
          VITE_PUBLIC_SITE_ORIGIN: ${{ vars.PORTAL_PUBLIC_SITE_ORIGIN }}
          VITE_ORGANIZATION_PHONE: ${{ vars.PORTAL_ORGANIZATION_PHONE }}
          VITE_LEGAL_EFFECTIVE_DATE: ${{ vars.PORTAL_LEGAL_EFFECTIVE_DATE }}
          VITE_SUPPORT_HOURS: ${{ vars.PORTAL_SUPPORT_HOURS }}
          VITE_SUPPORT_LANGUAGES: ${{ vars.PORTAL_SUPPORT_LANGUAGES }}
          VITE_SUPPORT_RESPONSE_TIME: ${{ vars.PORTAL_SUPPORT_RESPONSE_TIME }}
          VITE_ACCOUNT_DELETION_CHANNEL: ${{ vars.PORTAL_ACCOUNT_DELETION_CHANNEL }}
        run: |
          missing=""
          for v in VITE_PORTAL_BACKEND_RELEASE VITE_PUBLIC_SITE_ORIGIN VITE_ORGANIZATION_PHONE VITE_LEGAL_EFFECTIVE_DATE VITE_SUPPORT_HOURS VITE_SUPPORT_LANGUAGES VITE_SUPPORT_RESPONSE_TIME VITE_ACCOUNT_DELETION_CHANNEL; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "SKIPPED: no production portal package — repository variables missing for:$missing" | tee "$EV/portal-production-release.txt"
            exit 0
          fi
          [[ "$VITE_PORTAL_BACKEND_RELEASE" =~ ^[0-9a-f]{40}$ ]] || { echo "FAIL: PORTAL_BACKEND_RELEASE is not a full 40-character commit"; exit 1; }
          rm -rf dist dist-ssr /tmp/portal-production-release
          set -o pipefail
          # A real production build: the PORTAL gate checks every input, and production mode leaves the console out.
          npm run build 2>&1 | tee "$EV/portal-production-build.log"
          (cd dist && find . -type f | sort) > "$EV/portal-production-dist-files.txt"
          node scripts/audit-links.mjs dist 2>&1 | tee "$EV/portal-production-audit-links.txt"
          node scripts/audit-bundle.mjs dist --portal --no-console 2>&1 | tee "$EV/portal-production-audit-bundle.txt"
          if [ -n "$(find dist -name '*.map' -print -quit)" ]; then echo "FAIL: source maps in the portal build"; exit 1; fi
          if grep -rqE --include='*.js' --include='*.html' --include='*.css' '\.invalid\b|\[TEST\]' dist; then echo "FAIL: preview or test values in the portal build"; exit 1; fi
          other=$(grep -rhoE 'https?://[A-Za-z0-9.-]+(:[0-9]+)?/api/v1' dist | sort -u | grep -vx 'https://api.tsxmr.com/api/v1' || true)
          if [ -n "$other" ]; then echo "FAIL: another API in the portal build: $other"; exit 1; fi
          docker run --rm -v "$PWD/dist:/dist" zricethezav/gitleaks:latest dir /dist --redact --no-banner 2>&1 | tee "$EV/portal-production-gitleaks.txt"
          # Without --audit: a release portal-site.sh may install. The packager refuses /admin, console code, a preview
          # build and any API but https://api.tsxmr.com.
          node scripts/caddy-portal-release.mjs dist /tmp/portal-production-release "$GITHUB_SHA" 2>&1 | tee -a "$EV/portal-production-release.txt"
          if grep -q 'audit build' /tmp/portal-production-release/portal-release.txt; then echo "FAIL: an audit package"; exit 1; fi
          if grep -qF '/admin' /tmp/portal-production-release/routes.caddy; then echo "FAIL: /admin in the portal routes"; exit 1; fi
          if grep -rqE 'platform/admin/|platform/businesses|platform/dashboard' /tmp/portal-production-release/site; then echo "FAIL: console code in the package"; exit 1; fi
          grep -qF "connect-src 'self' https://api.tsxmr.com;" /tmp/portal-production-release/routes.caddy
          grep -qF '/claim/*' /tmp/portal-production-release/routes.caddy
          printf 'backend %s\ndeletion %s\n' "$VITE_PORTAL_BACKEND_RELEASE" "$VITE_ACCOUNT_DELETION_CHANNEL" >> /tmp/portal-production-release/portal-release.txt
          (cd /tmp/portal-production-release && find . -type f | sort | xargs sha256sum) > "$EV/portal-production-release.sha256"
          (cd /tmp/portal-production-release && tar czf - .) > "$EV/portal-production-release.tar.gz"
          sha256sum "$EV/portal-production-release.tar.gz" | tee -a "$EV/portal-production-release.txt"
      - name: Keep the evidence
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'commit %s\nbranch %s\nrun %s\nresult %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$RESULT" > "$EV/summary.txt"
          rm -rf "$EV/playwright-output"
          cp -r evidence /tmp/evidence
          git config user.name "ci-evidence"
          git config user.email "ci-evidence@users.noreply.github.com"
          git stash -u -q || true
          if git fetch -q origin ci-evidence; then git checkout -q -B ci-evidence origin/ci-evidence; else git checkout -q --orphan ci-evidence; git rm -rq --cached . ; git clean -fdq -e node_modules; fi
          rm -rf evidence/"$GITHUB_SHA"; mkdir -p evidence; cp -r /tmp/evidence/"$GITHUB_SHA" evidence/
          git add evidence/"$GITHUB_SHA"
          git commit -qm "evidence: $GITHUB_REF_NAME $GITHUB_SHA ($RESULT)"
          for i in 1 2 3 4 5; do git push -q origin ci-evidence && break; git fetch -q origin ci-evidence && git rebase -q origin/ci-evidence; done
