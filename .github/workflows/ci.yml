# The website's checks, on Linux (the owner's Windows PC cannot run Vite 8: Smart App Control blocks its native
# bundler). Runs on every push of a non-main branch and by hand. It builds and tests; it deploys nothing.
name: ci

on:
  push:
    branches-ignore: [main, ci-evidence]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npx vite build
