# Promoter attribution and user invitations (0103, D221), end to end on GitHub runners, in Chromium and WebKit.
#
# MySQL 8.4.11, the API built from the backend commit with every migration applied (REFERRAL_KEY and the portal origin
# generated/set here), an administrator made from the shell with MFA, the console/site full build and the app's web
# export from the commits in verify/target.env; then verify/promoter-journey.mjs: the console (create, generate,
# card, download, regenerate, deactivate/activate), /join, the app's registration from a QR address, a code typed in
# Arabic digits, a code deactivated before submission, an invitation through the app's /join, the report, and the
# wrong-guess limit.
#
# WebKit here is browser automation on Linux, not a physical iPhone. Nothing is deployed; every secret is generated in
# the job and never printed; the evidence (statuses and screenshots only) goes to `ci-evidence`.
name: verify-promoter-attribution

on:
  push:
    branches: [ops/verify-promoter-attribution]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-promoter-attribution
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    permissions:
      contents: write # only to commit the evidence branch
    services:
      mysql:
        image: mysql:8.4.11@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 30
    defaults:
      run:
        shell: bash
    env:
      WORK: ${{ github.workspace }}/work/
      APPDIR: ${{ github.workspace }}/app
      WEBDIR: ${{ github.workspace }}/web
      API: http://127.0.0.1:3410/api/v1
      APP: http://127.0.0.1:4320
      WEB: http://127.0.0.1:4173
      DB: sa_e2e
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with: { path: tools }
      - name: The target
        run: |
          set -a; source tools/verify/target.env; set +a
          for v in BACKEND WEB MOBILE; do [[ "${!v}" =~ ^[0-9a-f]{40}$ ]] || { echo "$v must be a full SHA"; exit 1; }; done
          { echo "BACKEND=$BACKEND"; echo "WEBSHA=$WEB"; echo "MOBILE=$MOBILE"; echo "EV=$GITHUB_WORKSPACE/evidence/promoter-attribution/${BACKEND:0:7}-${WEB:0:7}-${MOBILE:0:7}-$GITHUB_RUN_ID/${{ matrix.browser }}"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { repository: AbdelkerimMahfoudh/erp-backend, ref: '${{ env.BACKEND }}', path: api }
      - uses: actions/checkout@v4
        with: { repository: AbdelkerimMahfoudh/erp-control-web, ref: '${{ env.WEBSHA }}', path: web }
      - uses: actions/checkout@v4
        with: { repository: AbdelkerimMahfoudh/erp-mobile, ref: '${{ env.MOBILE }}', path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: |
          mkdir -p "$EV" "$WORK"; chmod 700 "$WORK"
          printf 'backend %s\nweb %s\nmobile %s\nbrowser %s\nrun %s\n' "$BACKEND" "$WEBSHA" "$MOBILE" "$BROWSER" "$GITHUB_RUN_ID" > "$EV/target.txt"
          (cd api && npm ci --no-audit --no-fund > "$EV/api-install.log" 2>&1)
          (cd web && npm ci --no-audit --no-fund > "$EV/web-install.log" 2>&1)
          (cd app && npm ci --no-audit --no-fund > "$EV/app-install.log" 2>&1)
          (cd tools && npm install --no-audit --no-fund > "$EV/tools-install.log" 2>&1 && npx playwright install --with-deps "$BROWSER" > "$EV/playwright-install.log" 2>&1)
      - name: The database, the API and an administrator with MFA
        run: |
          umask 077
          mysql -h 127.0.0.1 -P 3306 --protocol=TCP -u root -e "CREATE DATABASE sa_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            CREATE USER 'phonestore_app'@'%' IDENTIFIED BY '$(openssl rand -hex 16 | tee "${WORK}app.pw")';
            GRANT SELECT, INSERT, UPDATE, DELETE ON sa_e2e.* TO 'phonestore_app'@'%';"
          {
            echo "NODE_ENV=development"; echo "APP_ENV=staging"; echo "STAGING_CONTACT_OUTBOX=enabled"; echo "PORT=3410"
            # Behind a trusted local proxy: the journey gives each check meant to fail its own client address.
            echo "API_INGRESS=loopback"; echo "API_BIND=127.0.0.1"
            echo "DATABASE_URL=mysql://root:@127.0.0.1:3306/sa_e2e"
            echo "APP_DATABASE_URL=mysql://phonestore_app:$(cat "${WORK}app.pw")@127.0.0.1:3306/sa_e2e"
            for k in JWT_ACCESS_SECRET STAFF_INVITATION_KEY OTP_PEPPER MESSAGING_HASH_KEY REFERRAL_KEY; do echo "$k=$(openssl rand -hex 32)"; done
            echo "PLATFORM_MFA_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
            echo "PORTAL_ORIGIN=https://dukan.example.test"; echo "COOKIE_SECURE=false"
            echo "CUSTOMER_ACTIVATION=closed"; echo "CORS_ORIGINS=$WEB,$APP"
            echo "SWAGGER_ENABLED=false"; echo "LOG_LEVEL=warn"; echo "WHATSAPP_CHANNEL=disabled"; echo "EMAIL_CHANNEL=disabled"
            echo "UPLOAD_DIR=${WORK}uploads"; echo "THROTTLE_LIMIT=5000"; echo "AUTH_THROTTLE_LIMIT=1000"; echo "ACCOUNT_THROTTLE_LIMIT=1000"
          } > "${WORK}api.env"
          openssl rand -hex 24 | tr -d '\n' > "${WORK}admin.pw"
          cd api
          set -a; source "${WORK}api.env"; set +a
          npx prisma generate > /dev/null
          npx nest build > "$EV/api-build.log" 2>&1
          npx prisma migrate deploy > "$EV/migrate.log" 2>&1
          PLATFORM_ADMIN_PASSWORD="$(cat "${WORK}admin.pw")" npx ts-node --transpile-only prisma/create-platform-admin.ts ops@example.test "Platform Ops" > /dev/null 2>&1
          npx ts-node --transpile-only prisma/platform-admin-mfa.ts enrolment-token ops@example.test > "${WORK}enrol.out" 2>&1
          nohup node dist/src/main.js > "${WORK}api.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:3410/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3410/api/health/ready | tee "$EV/ready.json"; echo
      - name: The console and site (full preview build) and the app (web export) against this API
        run: |
          (cd web && VITE_API_BASE=$API VITE_APP_WEB_ORIGIN=$APP npm run build:preview > "$EV/web-build.log" 2>&1)
          nohup node web/scripts/serve-dist.mjs 4173 "$WEBDIR/dist" > "${WORK}web-serve.log" 2>&1 &
          (cd app && EXPO_PUBLIC_API_ORIGIN=${API%/api/v1} EXPO_PUBLIC_LEGAL_ORIGIN=https://tsxmr.com npx expo export --platform web --clear --output-dir "${WORK}app-dist" > "$EV/app-export.log" 2>&1)
          nohup node tools/verify/static-serve.mjs "${WORK}app-dist" 4320 > "${WORK}app-serve.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf -o /dev/null "$APP/" && curl -sf -o /dev/null "$WEB/join" && break; sleep 1; done
      - name: The administrator's second factor
        run: cd tools && node verify/enrol.mjs 2>&1 | tee "$EV/enrol.log"
      - name: The promoter journey — console, card, /join, registration by QR, code, invitation, refusal, report, limit
        run: set -o pipefail; cd tools && node verify/promoter-journey.mjs 2>&1 | tee "$EV/promoter-journey.log"
      - name: Keep the evidence
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'result %s\nbrowser %s (Playwright on Linux) — not a physical iPhone\n' "$RESULT" "$BROWSER" >> "$EV/target.txt"
          for f in "$WORK"promoter-journey-*.json "$WORK"enrol-*.json; do [ -f "$f" ] && cp "$f" "$EV/"; done
          [ -d "${WORK}shots" ] && cp -r "${WORK}shots" "$EV/screenshots"
          # Nothing secret leaves the runner: statuses, results and screenshots only.
          for secret in "$(cat "${WORK}admin.pw")" "$(cat "${WORK}app.pw")" "$(grep '^REFERRAL_KEY=' "${WORK}api.env" | cut -d= -f2)"; do
            if grep -rlF "$secret" "$EV" > /dev/null 2>&1; then echo "a secret reached the evidence"; exit 1; fi
          done
          cd tools
          git config user.name "ci-evidence"
          git config user.email "ci-evidence@users.noreply.github.com"
          git fetch -q origin ci-evidence && git checkout -q -B ci-evidence origin/ci-evidence
          mkdir -p evidence/promoter-attribution; cp -r "$GITHUB_WORKSPACE/evidence/promoter-attribution/." evidence/promoter-attribution/
          git add evidence/promoter-attribution
          git commit -qm "evidence: promoter attribution in $BROWSER — backend ${BACKEND:0:7}, web ${WEBSHA:0:7}, mobile ${MOBILE:0:7} ($RESULT)"
          for i in 1 2 3 4 5; do git push -q origin ci-evidence && break; git fetch -q origin ci-evidence && git rebase -q origin/ci-evidence; done
